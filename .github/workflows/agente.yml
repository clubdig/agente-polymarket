name: agente-polymarket

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalar dependencias
        run: pip install --quiet -r requirements.txt
      - name: ciclo do agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER: ${{ secrets.POLY_FUNDER }}
          POLY_DESTINO: ${{ secrets.POLY_DESTINO }}
        run: |
          python agente.py --once
          python levamento.py > docs/ledger.json || true
      - name: public painel e ledger
        run: |
          git config user.name "agente-polymarket"
          git config user.email "agente@users.noreply.github.com"
          git add docs state.json posicoes.json operacoes.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "ciclo $(date -u +%FT%TZ)"
          git push
